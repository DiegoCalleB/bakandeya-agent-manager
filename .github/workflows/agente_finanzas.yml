name: Agente de Finanzas

on:
  schedule:
    # Se ejecuta todos los lunes a las 10:00 UTC (12:00 PM hora de Madrid en verano, 11:00 AM en invierno)
    - cron: "0 10 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  finance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escribir credenciales de la cuenta de servicio de Google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > credentials_service_account.json

      - name: Ejecutar Agente de Finanzas
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials_service_account.json
          GOOGLE_SHEETS_DOCUMENT: "Bakandeya Leads"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agents/agente_finanzas.py

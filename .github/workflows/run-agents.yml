name: Run Python Agents

on:
  # Permite el disparo automático por tiempo (Cron)
  schedule:
    - cron: '0 9 * * *' # Corre todos los días a las 09:00 UTC
    
  # Permite que la aplicación web lo active en directo con parámetros
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agente de Bakandeya a ejecutar'
        required: true
        default: 'scout'
        type: choice
        options:
          - scout
          - scout_descubridor
          - redactor
          - enviador
          - lector
      extra_args:
        description: 'Argumentos adicionales para el script de Python (ej: --region Navarra --tipo sala)'
        required: false
        default: ''
        type: string

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 🔑 1. Crea el archivo físico de credenciales a partir de tu secreto de GitHub
      - name: Crear archivo de credenciales de Google
        run: |
          echo '${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}' > /tmp/google_creds.json

      # 🚀 2. Ejecuta el Agente pasando la variable de entorno apuntando al archivo temporal
      - name: Ejecutar Agente de Bakandeya
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/google_creds.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          # Determinar qué agente disparar (por input manual/API o fallback de schedule)
          AGENT="${{ github.event.inputs.agent }}"
          ARGS="${{ github.event.inputs.extra_args }}"
          
          # Si se dispara por cron (schedule), ejecutamos por defecto el Lector de bandeja
          if [ "${{ github.event_name }}" = "schedule" ]; then
            AGENT="lector"
          fi

          echo "Iniciando ejecución de agente: $AGENT"
          echo "Argumentos adicionales: $ARGS"

          # Enrutador inteligente para tus scripts de agents/
          if [ "$AGENT" = "scout" ]; then
            python agents/scout.py $ARGS
          elif [ "$AGENT" = "scout_descubridor" ]; then
            python agents/scout_descubridor.py $ARGS
          elif [ "$AGENT" = "redactor" ]; then
            python agents/redactor.py $ARGS
          elif [ "$AGENT" = "enviador" ]; then
            python agents/enviador.py $ARGS
          elif [ "$AGENT" = "lector" ]; then
            python agents/lector.py $ARGS
          else
            echo "Error: Agente '$AGENT' no reconocido."
            exit 1
          fi

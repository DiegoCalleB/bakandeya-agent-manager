name: Run Bakandeya Python Agents

on:
  workflow_dispatch:
    inputs:
      agent:
        description: 'Nombre del agente a ejecutar (scout, scout_descubridor, redactor, enviador, lector_bandeja)'
        required: true
        default: 'scout'
      extra_args:
        description: 'Argumentos adicionales para el script de Python (ej. --region "Madrid")'
        required: false
        default: ''

jobs:
  run-agent-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-size: '3.10'
          cache: 'pip' # Opcional si usas caché de dependencias

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Python Agent
        env:
          # Aquí declaras los secretos de tu repositorio que usan tus agentes Python
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_TOKEN_SECRET: ${{ secrets.GMAIL_TOKEN_SECRET }}
        run: |
          # Esto ejecuta dinámicamente el agente recibido (ej. agents/scout_descubridor.py) con sus argumentos
          python agents/${{ github.event.inputs.agent }}.py ${{ github.event.inputs.extra_args }}
